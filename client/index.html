<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="alternate icon" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#065f46" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS ignores display:"standalone" in the manifest unless these are also
         set — without them, "Add to Home Screen" just bookmarks the page in
         Safari instead of launching standalone, and standalone mode is a hard
         requirement for Web Push to work on iOS at all (see README "Strong
         buy/sell signal subscriptions"). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyShare" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Search TASI (Tadawul) and US (NASDAQ/S&P 500) companies by code, ticker, or name, view live price charts, and get bilingual technical + money-flow buy/sell analysis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MyShare — TASI & US Stocks</title>
    <script>
      // Runs before first paint so a saved theme preference (or the OS
      // preference, on a first visit) applies immediately — without this,
      // ThemeProvider setting the attribute after React mounts would cause
      // a visible flash from the default dark colors to the real theme.
      (function () {
        try {
          var saved = localStorage.getItem("myshare-theme");
          var theme = saved === "light" || saved === "dark" ? saved : null;
          if (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
          if (theme) document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* ignore */
        }
      })();
      // Same idea for language/direction: a saved explicit choice, or the
      // device/browser locale on a first visit, applied before paint so the
      // page doesn't flash from the hardcoded ar/rtl above to the real value
      // once LanguageProvider mounts.
      (function () {
        try {
          var lang = localStorage.getItem("myshare-lang");
          if (lang !== "en" && lang !== "ar") {
            lang = null;
            var candidates = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]) || [];
            for (var i = 0; i < candidates.length; i++) {
              var primary = (candidates[i] || "").toLowerCase().split("-")[0];
              if (primary === "en") { lang = "en"; break; }
              if (primary === "ar") { lang = "ar"; break; }
            }
          }
          if (lang === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
          }
          // lang === "ar" needs no change — that's already the markup default above.
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
